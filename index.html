<script type="application/json" id="seed-bank">{"bank_version":"ipa-pds-system-original-quality-test-20261122-v1","schema_version":"2.0","mode":"learning","source_notice":"非公式オリジナル予想問題。IPA公式問題ではない。2026-11-22時点の公表案に基づく。","source_urls":["https://www.ipa.go.jp/shiken/syllabus/henkou/2026/20260630.html","https://www.ipa.go.jp/shiken/syllabus/henkou/2026/20260622.html"],"total_questions":15,"questions":[{"question_id":"T26-A1-001","question_version":"1.0.0","section":"A1","major":"ビジネス変革","minor":"投資判断・感度分析","difficulty":"標準","stem":"新規受注システムの投資評価で、基準シナリオのNPVはプラスである。ただし、便益の大半を「取引件数の増加」が占め、その予測に大きな不確実性がある。投資判断に先立って最も有益な分析はどれか。","options":["全費用を初期費用に計上し直して、資金回収期間だけで比較する","将来便益を割り引かずに合計し、楽観値の収益性を確認する","取引件数を変化させたときのNPVと損益分岐となる件数を確認する","過去の類似投資のNPV平均値を用い、個別の件数予測を代替する"],"answer":"C","why":"不確実なのは便益の主要な決定要因である取引件数なので、その値を変えた感度分析でNPVの符号が変わる境界を確認する。期待NPVが正でも、成立条件が脆弱であれば意思決定上のリスクは大きい。","optionNotes":["回収期間は資金繰り上の指標として役立つが、今回の最大不確実要因である取引件数の影響を切り分けない。資金制約が支配的な案件では補助指標になり得る。","割引前の合計は短期のキャッシュイン把握に使えるが、NPVで評価する前提の時間価値を落とす。楽観値の確認だけでは下振れ耐性を示せない。","正解。単価・利益率・運用費などを固定した上で取引件数を上下に振ると、NPVがゼロになる条件と見込みの安全余裕を評価できる。","過去案件の実績は予測校正に役立つ一方、今回の件数予測を置き換えるだけでは個別案件の収益構造を説明しない。類似性が高い場合には参照値となる。"],"depth":"NPVは将来の正味キャッシュフローを割引率で現在価値に直した総和から初期投資を差し引く。感度分析は一つの入力変数を変動させ、出力の変化を見る手法で、複数変数を同時に変えるシナリオ分析とも区別する。","application":"件数が損益分岐点に近い場合は、段階導入で実績を測り、追加投資を判断する方法がある。件数だけでなく顧客単価や解約率との相関を考慮する必要もある。","case":"","syllabus_mapping":"共通知識：ビジネス変革／経営戦略"},{"question_id":"T26-A1-002","question_version":"1.0.0","section":"A1","major":"セキュリティ","minor":"暗号鍵管理","difficulty":"応用","stem":"個人情報を暗号化したバックアップを5年間保存する。暗号鍵の漏えいリスクを抑えつつ、保存期間中の旧バックアップも復号できるようにしたい。鍵の更新方針として最も適切なのはどれか。","options":["新規バックアップに新鍵を使い、旧バックアップの復号鍵はアクセス制限付きで保持する","全バックアップの鍵識別子を新鍵の識別子に変更し、データ本体はそのまま置く","新鍵を配布した時点で旧鍵を破棄し、旧世代のバックアップは保存期限まで保持する","暗号化したバックアップを移動せず、旧鍵と新鍵の識別子を同一にして扱う"],"answer":"A","why":"鍵をローテーションしても、旧鍵で暗号化されたデータは自動的に新鍵で読めるようにならない。長期保存が必要なら、新規データは新鍵に切り替え、旧世代データの読取り経路と旧鍵のアクセス制限・廃棄時期を管理する。","optionNotes":["正解。鍵世代とバックアップの対応を記録し、旧鍵は保護された鍵管理基盤で必要期間だけ利用可能にする。必要なら旧データを安全に再暗号化する。","鍵識別子は復号に使う鍵を選ぶメタデータであり、暗号文自体を変換しない。再暗号化やデータ鍵の再ラップを別途実施した場合には新識別子が妥当となる。","旧世代データを消してよい保持方針なら旧鍵廃棄も選択肢だが、この設問の5年間復号できる要件に反する。","同一の鍵識別子で異なる鍵実体を指すと、再現性と監査性を損なう。鍵世代に追随できる暗号鍵管理が必要で、移動の有無は本質ではない。"],"depth":"暗号鍵には暗号化・復号に用いるデータ鍵と、それを暗号化して保護する鍵暗号化鍵がある。データ鍵を再ラップする方式なら大量の暗号文を再暗号化せずに鍵保護階層を変更できる場合がある。何を更新したかを区別する。","application":"バックアップ復元訓練は「データが残っている」だけでなく、その時点で適切な鍵世代が復号可能かも検証する。退職者や委託先の権限が旧鍵に残っていないか確認する。","case":"","syllabus_mapping":"共通知識：セキュリティ／暗号技術"},{"question_id":"T26-A1-003","question_version":"1.0.0","section":"A1","major":"ネットワーク","minor":"HTTP条件付き要求","difficulty":"標準","stem":"社内ポータルの大きなJSON設定ファイルは頻繁には変わらないが、利用者は更新時には新しい内容を取得する必要がある。ブラウザが保存済みのETagを持つ場合、通常のHTTPキャッシュ再検証として最も適切なのはどれか。","options":["毎回Cache-Control: no-storeを付け、利用者側の保存を抑止する","Last-Modifiedの時刻をクライアントで書き換え、更新有無を推定する","ETagをURLパラメータへ付け、応答本文を毎回取得する","If-None-MatchにETagを付けて要求し、未変更なら304応答を使う"],"answer":"D","why":"ETagはサーバーが表現の版を識別するバリデータであり、If-None-Matchを伴う条件付きGETで再検証できる。未更新なら304 Not Modifiedによって応答本文の再転送を省け、更新時は新しい表現を得られる。","optionNotes":["機密情報を端末に残したくない場合にはno-storeが有効だが、今回の転送量削減と再利用の目的とは異なる。","Last-Modified/If-Modified-Sinceの再検証も候補だが、クライアントが独自に時刻を書き換えるとサーバー側の更新判定として信頼できない。","URLのバージョニングはビルド資産の配信には適するが、毎回本文を取得すると未変更時の転送量を削減できない。","正解。サーバー側でETagと現在の表現を比較し、同一なら304、異なれば200と新しい表現を返す。"],"depth":"HTTPキャッシュのfreshness（まだ再検証せずに使用できる期間）とvalidation（保存した内容が現在も正しいかの確認）は別の概念。ETagは通常、レスポンスの特定の表現に対する識別子で、条件付き要求に利用する。","application":"共有キャッシュがユーザー固有のJSONを混同しないよう、認証情報、Cache-Control、Vary等の設計を確認する。更新頻度が低い場合はキャッシュ再検証が帯域と鮮度の折衷になる。","case":"","syllabus_mapping":"共通知識：ネットワーク／Web技術"},{"question_id":"T26-A1-004","question_version":"1.0.0","section":"A1","major":"OS・コンピュータ","minor":"DMAと割込み","difficulty":"基礎","stem":"ストレージ装置からメモリへ大容量データを転送する処理で、CPUによるデータの逐次コピー負担を減らしたい。転送完了の通知も必要である。一般的な装置・OSの機構として最も目的に合うのはどれか。","options":["割込みを使い、CPUが各データ単位を装置レジスタから読み出す","DMAで装置とメモリ間を転送し、完了を割込みなどで通知する","ポーリング間隔を短くし、CPUが装置の状態を頻繁に確認する","メモリマップドI/OでCPUが装置のデータレジスタを連続して読み込む"],"answer":"B","why":"DMA（Direct Memory Access）は対応する装置・コントローラーがCPUによる各バイトのコピーを介さずメモリとの間でデータを転送する仕組み。完了割込みと組み合わせることで転送と通知の役割を分けられる。","optionNotes":["割込み駆動I/Oは無駄な待ちを減らすが、各データ単位をCPUがコピーする設計では逐次コピー負荷が残る。小さいI/Oには適する場合がある。","正解。転送設定のCPU処理は必要だが、まとまった転送ではDMAによりCPUのコピー回数を減らし、完了割込みで次工程へつなげられる。","短いポーリング間隔は低遅延を得られることがある一方、状態監視のCPU占有が増え、データコピー問題そのものを解消しない。","メモリマップドI/Oは装置レジスタへのアクセス手段であり、CPUがデータを読み書きするならコピー負荷は残る。制御レジスタ操作には有効。"],"depth":"プログラムI/OとDMAはデータ転送の主体が異なり、割込みとポーリングは完了や状態をどう知るかの違いである。したがってDMA＋割込み、DMA＋ポーリングなど組合せも可能で、概念を同一視しない。","application":"高速I/OではDMAバッファの所有権、CPUキャッシュとの整合性、転送後にCPUが安全に参照できる時点を管理する必要がある。DMAが使えればすべてのI/Oが速いという意味ではない。","case":"","syllabus_mapping":"共通知識：OS・コンピュータ／入出力制御"},{"question_id":"T26-A1-005","question_version":"1.0.0","section":"A1","major":"データベース","minor":"複合索引の列順","difficulty":"応用","stem":"受注表は(店舗ID, 受注日時, 状態, 金額)を持つ。主な検索は「店舗IDを指定し、受注日時の範囲で絞る」であり、状態の値は約3種類、店舗は数千ある。B-tree複合索引を1本追加する場合、最も合理的な先頭2列の順序はどれか。","options":["(受注日時, 店舗ID)：期間の指定を先頭に置いて全店舗を走査する","(状態, 受注日時)：種類が少ない状態で先に絞り込む","(店舗ID, 受注日時)：店舗の等価条件の後に日時範囲を置く","(金額, 状態)：集計対象の金額と状態を先に並べる"],"answer":"C","why":"検索は店舗IDの等価条件と受注日時の範囲条件を組み合わせる。一般的なB-treeの左側からの利用特性を踏まえると、店舗IDを先頭にし、その店舗内を受注日時で範囲走査する構成が適合しやすい。","optionNotes":["全店舗の期間検索が主なら日時を先頭にする合理性がある。ただし今回の店舗指定が中心というクエリ特性では、日時範囲後の店舗条件を索引探索に使いにくい。","状態で絞るクエリが支配的なら候補になるが、設問では状態を主条件としていない。選択性の低さだけで常に不利と判断するわけでもない。","正解。店舗ごとに並んだ受注日時を範囲走査でき、主要クエリのアクセスパターンに合わせた配置になる。","金額集計をカバリング索引にしたい場合などは一部で有効だが、店舗・日時の検索条件を索引の先頭から利用しづらい。"],"depth":"複合B-tree索引では一般に等価述語を前に、範囲述語をその後に置くと探索範囲を絞りやすい。ただしDBエンジン、統計、クラスタ化、索引スキップスキャンなどにより実際の実行計画は異なる。","application":"本番相当の分布でEXPLAINや実行計画を測定し、追加索引の書込みコストも評価する。店舗IDの偏りが大きい場合、平均的な店舗の実行時間だけで設計しない。","case":"","syllabus_mapping":"共通知識：データベース／索引設計"},{"question_id":"T26-A1-006","question_version":"1.0.0","section":"A1","major":"開発・品質","minor":"ミューテーションテスト","difficulty":"応用","stem":"金額計算モジュールの単体テストは全分岐を実行している。しかし、比較演算子を「>=」から「>」へ変更した不具合を検出できない懸念がある。既存テストの識別力を評価する方法として最も直接的なのはどれか。","options":["比較演算子を意図的に変えた変異体を作り、テストの失敗を確認する","分岐カバレッジを再計測し、目標100%達成を再び確認する","テスト実行時間と実行頻度を測り、単位時間の実行回数を増やす","静的解析の警告件数を測り、変更箇所の警告が出ないことを確認する"],"answer":"A","why":"ミューテーションテストは演算子などに小さな人工的欠陥（変異）を入れ、テストが異常を検出できるかを確認する。比較演算子の変異が生き残れば、その境界を区別するテストが不足している可能性を示す。","optionNotes":["正解。>=を>へ変える変異体は境界値そのものを問うテストで検出できるかを評価する材料になる。等価な変異体である可能性の除外も必要。","分岐カバレッジは両分岐を通ったかを測るもので、境界値や比較演算子の意味差を観測できたかは示さない。カバレッジ不足の発見には有効。","短い実行時間はCI運用で重要だが、同じ入力の実行を増やしても検出能力を直接測る指標ではない。","静的解析は欠陥候補を検出できる一方、テストが条件の違いを見分ける能力を測定するものではない。"],"depth":"100%の網羅率と、誤った結果を検出できることは異なる。変異体を検出した場合は「kill」、テストが通ってしまう場合は「survive」と呼ぶ。境界値テストや期待結果のアサーションが弱いと変異体が生き残る。","application":"変異テストは計算量が大きくなるため、金額計算・権限判定など重要なロジックに絞って採用できる。テストの期待値を実装から再計算すると同じ誤りを見逃しやすい。","case":"","syllabus_mapping":"共通知識：ソフトウェア開発／テスト"},{"question_id":"T26-A1-007","question_version":"1.0.0","section":"A1","major":"データ・マネジメント","minor":"データリネージ","difficulty":"標準","stem":"経営ダッシュボードで売上が前日より大きく減少した。原因が現実の売上変化か、複数の加工処理の欠陥かを追跡するため、集計値から元データと変換処理まで遡れるようにしたい。最も直接的に役立つ管理情報はどれか。","options":["データ辞書で、売上列の名称・単位・算定定義などを統一して登録する","データカタログで、分析基盤の表の所有部門だけを登録する","アクセスログで、ダッシュボードを閲覧した人を記録する","データリネージで、入力源・変換処理・出力先の依存関係を記録する"],"answer":"D","why":"リネージはデータがどこから来て、どの変換を通り、どの出力へ使われたかを辿る情報である。異常値の原因を特定するとき、入力データの変化と変換ロジックの変更を切り分ける経路を提供する。","optionNotes":["売上列の算定定義が変わった場合にはデータ辞書が異常の切分けに役立つ。ただしデータが通過した各変換処理と依存先の追跡までは提供しない。","所有者情報は問い合わせ先を特定する際には重要だが、処理間の依存関係や発生箇所を直接追跡する情報ではない。","アクセスログは閲覧監査に有効だが、集計値の生成経路や欠陥の伝播を示すものではない。","正解。売上ソース、抽出・フィルタ・通貨換算・結合、表示テーブルを関連付ければ、どの段で件数が減ったかを調べられる。"],"depth":"リネージには表単位と列単位など粒度がある。列単位では「税込金額」がどの入力列と換算処理から生まれたかを追える。辞書・カタログ・品質ルールとの連携で分析資産の信頼性を高める。","application":"前日の急減がソース側の遅延によるものなら、リネージだけでなく処理時刻・到着遅延・品質検証の記録が必要になる。監視と根本原因調査の役割を分ける。","case":"","syllabus_mapping":"共通知識：データ活用／データ管理"},{"question_id":"T26-A1-008","question_version":"1.0.0","section":"A1","major":"AI・データ分析","minor":"データリーク","difficulty":"標準","stem":"顧客の来月の解約を予測するモデルを評価する。顧客ごとに月次レコードがあり、同じ顧客の翌月情報や予測時点後に確定する情報が含まれる。実運用性能を過大評価しない検証設計として最も適切なのはどれか。","options":["月次レコードをランダムに分割し、学習・評価に同じ顧客が含まれるようにする","予測時点で利用可能な特徴量に限定し、未来期間のデータで時系列評価する","全データで特徴量を標準化した後に、学習・評価へランダム分割する","解約確定後に計算できる指標を特徴に加え、テストデータの精度を確認する"],"answer":"B","why":"本番では予測時点より未来の情報を使えない。特徴量の利用可能時点を固定し、未来期間を評価に回すと、時間の逆流によるデータリークを抑制し実際の予測条件に近づけられる。","optionNotes":["同一顧客の時間的に近い記録が学習・評価へ混入すると、個人固有の傾向を過剰に利用して精度が高く見える場合がある。将来への一般化検証には不向き。","正解。学習時点より後の月をテストに使い、特徴量がその時点で取得できることを確認する。必要に応じ顧客単位の分割制約も加える。","全データから平均・分散を求めると、評価期間の情報が前処理に流入する。学習データだけでfitし評価へ適用する。","解約確定後の情報は学習時には強い説明変数になり得るが、予測時には取得できないためオンライン性能を評価できない。"],"depth":"データリークは目的変数そのものが特徴に混じるケースだけでなく、未来情報を用いた集計や前処理、重複顧客の分割によっても発生する。時系列検証では学習窓と評価窓、必要なら情報公開遅延のギャップを設ける。","application":"本番で解約確定まで2週間かかる属性なら、特徴量作成時に確定日を持たせる必要がある。評価指標が高いほど、ラベルの生成経路を監査する価値がある。","case":"","syllabus_mapping":"共通知識：AI・データ活用／モデル評価"},{"question_id":"T26-A1-009","question_version":"1.0.0","section":"A1","major":"ビジネス変革","minor":"調達・契約方式","difficulty":"標準","stem":"新サービスの実証実験で外部エンジニアに3か月間の技術調査を依頼する。調査結果によって作業内容を毎週協議して調整し、成果物の完成を支払条件とすることは難しい。自社から技術者への直接の指揮命令は行わない。契約方式の方向性として最も適切なのはどれか。","options":["業務遂行の役務提供を中心に定め、稼働条件と報告内容を明確にする準委任型の契約","完成成果物を特定して検収することを重視し、仕様変更を契約変更で管理する請負型の契約","外部技術者を自社の指揮命令下に置き、作業を日々指示する労働者派遣契約","共同の研究成果と知的財産を持ち、双方で費用を分担する共同研究契約"],"answer":"A","why":"調査という役務を継続して遂行し、作業内容が変動し、完成物の引渡しを支払条件としにくいなら、準委任型の考え方が合う。契約類型の名称だけでなく成果物・責任範囲・報告義務を具体化する必要がある。","optionNotes":["正解。業務遂行の善管注意義務、報告・協議、稼働時間などを明確にし、完成の有無によらない業務遂行を評価する。","成果物・受入基準が固まっている開発では請負が有効だが、毎週変化する調査範囲では仕様確定・検収を前提にしづらい。","労働者派遣は発注側が直接指揮命令する場合に適するが、設問では個々の技術者へ直接の指揮命令を行わず、委託先と協議して調査を進める。","共同研究は当事者双方が研究目的や費用・知財を共有する場合に合理的だが、ここでは外部の専門家に役務提供を依頼する業務が中心で、共同事業の前提がない。"],"depth":"日本の民法上、請負は仕事の完成、準委任は委託された事務処理を目的とする。報酬や検収の具体条件は契約で定め、契約名だけで実質が確定するとは限らない。業務委託では指揮命令など労働者派遣との区別にも留意する。","application":"試行錯誤が多いPoCは、調査部分を準委任とし、仕様確定後の実装部分を別途請負とする分離調達が考えられる。途中成果の共有方法と知的財産・秘密保持を明示する。","case":"","syllabus_mapping":"共通知識：企業活動／調達"},{"question_id":"T26-A1-010","question_version":"1.0.0","section":"A1","major":"IoT・組込み","minor":"ウォッチドッグタイマ","difficulty":"基礎","stem":"無人設備の制御プログラムがまれに無限ループへ入り、外部からの通信にも応じなくなる。装置側で停止状態を検知して安全な再起動処理につなげたい。実装上、最も目的に合うのはどれか。","options":["操作ログを定期的に遠隔サーバーへ送信し、応答がなくなれば運用者が遠隔から再起動を命じる","CPUの平均使用率を計測し、平均が低いときにソフトウェア再起動する","独立したウォッチドッグを正常処理から定期更新し、更新停止時にリセット信号を出す","制御ループ内で例外ハンドラを追加し、想定する例外を捕捉して再実行する"],"answer":"C","why":"ウォッチドッグタイマは正常に進捗する処理から一定時間内に更新されることを前提に、更新が途絶えるとリセットなどを起こす監視機構。プログラム自体が応答不能な状態にも外側から対処できる。","optionNotes":["遠隔監視は運用面で有益だが、通信にも応じないという条件では遠隔命令が実行される保証がない。独立した遠隔電源制御がある場合は補完策になる。","CPU使用率が高い無限ループも低い待機ハングもあり、平均CPUだけでは異常検知が不安定。ソフトウェア自身が生存している前提も残る。","正解。外部ハードウェアのウォッチドッグ等なら制御プログラムのフリーズ時もタイムアウト検知ができる。","例外処理は明示的に発生する例外に対応できるが、無限ループに入ったまま例外が発生しない状況では動作しない。"],"depth":"ウォッチドッグを単に割込みで定期更新すると、本来の制御タスクが停止していても生存と誤認する。重要なタスクの正常進捗を確認できたときだけ更新する設計が必要。リセットと安全停止を同義としない。","application":"再起動時に駆動部が危険な動きをしないよう、出力を安全状態へ遷移させる回路や初期化シーケンスを別途設計する。原因追跡のためリセット原因を記録する。","case":"","syllabus_mapping":"共通知識：組込みシステム／信頼性"},{"question_id":"T26-A2-001","question_version":"1.0.0","section":"A2","major":"ネットワーク設計","minor":"顧客別API流量制御","difficulty":"応用","stem":"公開検索APIで顧客ごとの呼出し頻度を制御したい。顧客ごとに長期平均5件/秒を許容し、通常時には瞬間的な20件の要求も受け付ける。超過した要求は429応答として、待ち行列には入れない。他の顧客の利用状況で個々の許容量が減らない方式として、最も適切なのはどれか。","options":["顧客全体で100並列の共有セマフォを置き、空いた順に処理を開始する","顧客別に60秒固定窓で300回を許容し、窓の境界でカウンタを戻す","顧客別に流入要求を順にキューへ蓄積し、上限なく待ち時間を許容する","顧客別に容量20のトークンバケットを持ち、毎秒5個の割合で補充する"],"answer":"D","why":"トークンバケットは容量でバーストの上限を、補充速度で長期平均の処理量を制御する。顧客ごとに独立してバケットを設け、残数が足りないときに429を返せば、指定された3つの条件に対応できる。","optionNotes":["同時実行数を制御するセマフォはバックエンドの負荷保護に有効だが、顧客単位の5件/秒という要求頻度を制限できず、共有枠の取り合いも起こる。","60秒窓で300回は平均5件/秒の目安にはなるが、窓の境界付近で大量要求が集中することを制限しにくい。瞬間20件の制約に合わない。","キューによる平滑化は処理遅延を許容する非同期バッチに向くが、超過時には429を返し待ち行列へ入れないという設問条件に反する。","正解。バケット容量20が瞬間的な受入上限、毎秒5個の補充が長期的な持続率を定める。超過要求は待たせず429を返す。"],"depth":"トークンバケットは要求1件につきトークンを1個消費し、空なら拒否する。バケット容量は貯められる最大のトークン数であり、連続した大量要求に対する上限となる。漏出バケット方式とはバースト許容の性質が異なる。","application":"複数サーバーにAPIを分散する場合、各サーバーが独立したバケットを持つと全体の上限が倍増する。顧客別カウンタの一貫性と低遅延のバランス、429のRetry-Afterなどを設計する。","case":"","syllabus_mapping":"専門知識：ネットワーク／API設計・流量制御"},{"question_id":"T26-A2-002","question_version":"1.0.0","section":"A2","major":"データベース設計","minor":"ホットパーティション対策","difficulty":"応用","stem":"複数拠点の計測データを時刻順のキーで分散DBに格納したところ、最新時刻への書込みが一つのパーティションに集中した。全件に対する時間範囲検索も必要で、書込み負荷が課題である。候補のうち最も妥当な設計変更はどれか。","options":["時刻順の単一キーを維持し、対象パーティションの読取りレプリカの台数を増やす","拠点又は分散用バケットをキーに加えて書込みを分散し、時間検索で集約する","時刻をミリ秒から秒へ丸め、同じ時刻値へ書込みを集中させる","検索のために時刻索引を増やし、単一キーの分散方式は維持する"],"answer":"B","why":"単調増加する時刻を分散キーにすると、最も新しい範囲への書込みが一箇所に偏る可能性がある。分散用のキーを加えて書込み先を分け、読み出し側で複数パーティションを集約するのが、書込みと範囲検索のトレードオフに合う。","optionNotes":["読取りレプリカ増強は読取り性能や可用性には役立つが、集中している書込み先の負荷は基本的に解消しない。","正解。ハッシュバケットや拠点キーを組み合わせると新規書込みを分散できるが、期間検索は対象バケット横断となるため集約負荷を見積もる。","丸めは記録の時間精度を落とし、同じ値が増えて衝突を生みやすい。高精度が不要な分析用集計では有効な場合がある。","時刻索引は範囲検索を助けるが、分散キーのホットスポットは残る。索引更新の書込み負荷も増える可能性がある。"],"depth":"シャーディングキーはデータの局所性と負荷均等性の両方に影響する。時刻が連続的に増えるワークロードでは、単純な範囲シャーディングでホットスポットが起こりやすい。ハッシュ分散は書込みを均等化できる一方、範囲走査を複雑にする。","application":"監視では各パーティションの書込みQPSと遅延P99を見る。拠点ごとのデータ量が極端に異なるなら拠点キーだけでなく補助的な分散バケットを設ける。","case":"","syllabus_mapping":"専門知識：データベース／分散データ設計"},{"question_id":"T26-A2-003","question_version":"1.0.0","section":"A2","major":"IoT・組込み設計","minor":"OTA更新の復旧設計","difficulty":"応用","stem":"遠隔地の制御端末をOTAで更新する。更新中に電源断が発生する場合があり、現場へ保守員を派遣できるのは翌日以降。更新後のプログラムが起動に失敗しても、旧版で基本通信を再開できることが最優先である。方式として最も適切なのはどれか。","options":["単一領域に新ファームウェアを上書きし、書込み完了時に起動可能フラグを立てる","更新ファイルをクラウドに保管し、起動失敗後にネットワークから再取得する","A/B領域へ新旧を分けて格納し、起動検証に失敗したら旧領域へ戻す","新ファームウェアの署名検証を行い、既存領域へ順次上書きしてから再起動する"],"answer":"C","why":"電源断や起動失敗に対して現地作業なしで通信可能な状態へ戻すには、旧版を保持したA/Bスロットと起動確認・ロールバック制御が適合する。署名検証だけでは更新途中の破損や起動不良を回復できない。","optionNotes":["単一領域上書きでも電源断耐性のある更新方式は構築できるが、旧版を保持しない設計では起動失敗からの復旧保証が弱い。","ネットワーク起動や回復用ブートローダが使える環境では選択肢になるが、基本通信自体が起動できない条件では再取得に頼りにくい。","正解。ブートローダが旧領域を保持し、新版の起動成功・ヘルスチェックが確認できない場合に旧版へ戻せる。","署名検証は改ざんされたイメージを拒否する重要な対策だが、署名が正しいソフトウェアも起動失敗し得る。旧版の保持と切戻しは別問題。"],"depth":"A/B更新は未使用側へイメージを書き込み、検証後に起動先を変更する。起動成功を確定する仕組み（ブートカウンタやヘルスチェック）がなければ、新版の無限再起動を防げない。安全な書込み順序とブートローダ保護が重要。","application":"実際には設定データの互換性も考慮し、旧版へ戻したときに読める形式を維持する。試験では書込み途中の電断、署名失敗、起動失敗、通信復旧を別々に再現する。","case":"","syllabus_mapping":"専門知識：IoT・組込みシステム／OTA・信頼性"},{"question_id":"T26-B-001","question_version":"1.0.0","section":"B","major":"業務システム設計","minor":"規則改定と審査の説明責任","difficulty":"応用","stem":"この条件を同時に満たす実装・運用の組合せとして、最も適切なものはどれか。","options":["受理時の規則版と申請内容・証憑の履歴を保持し、承認・再審査を追記する。案件別に閲覧を制御する。","審査開始時の最新規則を参照し、承認理由と閲覧権限を保存する。再審査は元の結果へ反映する。","受理時の規則版を保存し、証憑は申請者の更新で上書きする。閲覧権限は案件別に管理する。","申請番号と承認時刻を記録し、証憑は月次監査CSVへ集約する。閲覧権限は職務ごとに管理する。"],"answer":"A","why":"規則版と当時の申請内容を保持し、承認や再審査を独立した追記型履歴とすることが重要。加えて、案件単位で閲覧権限を判定すれば、時間基準・監査・アクセス制限のすべてに対応できる。","optionNotes":["正解。規則版と証憑の各世代を残し、審査判断を追記すれば、受理時点の根拠と差替え前後を再現できる。担当案件と監査権限の両方を確認して閲覧を制御する。","審査開始時の最新版は新規の規則適用には有益だが、受理から審査まで20日空く要件では別版を使ってしまう。再審査の上書きも履歴要件と合わない。","規則版と閲覧権限の管理は適切だが、差替え前の証憑内容が消える。監査時に元の判断根拠を再現できるよう、差替え版の保存が別途必要。","月次CSVによる監査資料生成には意味があるが、証憑変更の逐次履歴を代替しない。また職務別権限だけでは他案件への不要な閲覧を抑制できない。"],"depth":"業務上のイベントには、申請受理、証憑差替え、審査実行、承認・差戻し、再審査などがある。処理時刻と業務上の基準時刻を別に残し、規則版と入力版から結果を再現できる構成が重要になる。","application":"政策上の基準が遡及改定される場合は、当初判定を改ざんせず、再計算の根拠・承認者・新しい結果を追記する。監査権限と担当者の編集権限は分ける。","case":"【自治体の事例】中小企業向け補助金申請のオンライン審査を新設する。募集要項は年度途中で見直されることがある。\n①申請受理後、担当者が審査を開始するまで最大20日かかる。適用する所得・設備要件は「受理時点で有効だった規則」とする。\n②申請者は審査中に添付証憑を差し替えることがあり、変更前後の証憑内容と担当者による承認理由を監査で再現できなければならない。\n③不服申立てによる再審査は元の審査結果を書き換えず、別の意思決定として追跡する。\n④証憑には機微な情報が含まれ、閲覧権限は案件担当者と監査担当者に限定する。","syllabus_mapping":"科目B：業務要件に基づくシステム設計・運用／監査"},{"question_id":"T26-B-002","question_version":"1.0.0","section":"B","major":"業務システム設計","minor":"遅延データと人間承認","difficulty":"応用","stem":"配送計画の誤更新を避けつつ、現場の意思決定に使える分析基盤の設計として、最も適切なのはどれか。","options":["サーバー受信時刻が新しいデータを最新とし、推薦された経路を10分ごとに自動で確定する。","端末時刻でイベントを整列し、予定到着時刻が短くなる経路なら承認履歴を置き換えて適用する。","通信遅延がある車両を分析対象から除き、運転者が手入力した走行実績を監査可能な配送履歴として利用する。","位置イベントに発生時刻と連番を持たせ、遅延・重複を処理する。推薦と承認済み指示を分けて版管理する。"],"answer":"D","why":"位置情報の到着順が現場での発生順と一致しないため、発生時刻と車両ごとの連番・重複排除で位置の鮮度を判断する。同時に推薦は意思決定の候補にとどめ、承認された指示版を保持する必要がある。","optionNotes":["受信時刻ベースはサーバーの処理順序把握には有効だが、20分遅れて到着した古い位置が最新と誤認される。人間承認の要件にも反する。","端末時刻は重要だが時計ずれがあり、単独では順序保証にならない。承認済み指示を上書きすると、どの経路を実際に指示したか説明できない。","通信遅延時に一部車両を除外する暫定運用はあり得るが、復帰後の情報を扱えず、全車両の配送履歴を維持する要求を十分に満たさない。","正解。端末側の発生時刻・連番・時計同期状態を管理してイベントの順序と鮮度を評価し、承認プロセスを推薦の計算から独立させる。"],"depth":"イベント時刻は現場で事象が起きた時刻、処理時刻はサーバーが受け取った時刻。到着遅延と重複を許容するストリーム処理ではウォーターマークや遅延データの訂正方針を設定する。業務指示の版管理はそれとは別の整合性要件である。","application":"車載端末の時計がずれる事象や連番のリセットにも備え、車両ID・セッションID・イベントIDなどを用いる。経路確定後に情報が更新されても、変更提案と再承認として扱えば監査と安全性を両立できる。","case":"【物流会社の事例】200台の車両の配送予定を、道路状況と位置情報から10分ごとに再計算して配車担当者へ提示する。\n①車載端末は通信断の間に位置情報を蓄積し、復帰後にまとめて送る。サーバー到着は発生から最大20分遅れる。再送による重複も起こる。\n②端末の時計は補正する運用だが、数秒程度のずれは残る。車両ごとにイベント連番を付けられる。\n③配車変更は担当者の承認後に運転者へ配信し、承認済み指示の内容と時刻を後から再現できる必要がある。\n④通信遅延中の車両も履歴集計から欠落させず、必要に応じ分析結果を遡及訂正する。","syllabus_mapping":"科目B：データ駆動の運用設計／ストリーム処理・業務統制"}],"display_name":"2026/11/22 品質監査テスト15問","audit_status":"内部品質監査済み（Q1/Q2/Q4）"}</script>

    return `<div class="metric"><strong>${esc(value)}</strong><span>${esc(title)}</span>${note ? `<small>${esc(note)}</small>` : ''}</div>`;
  }

  // Two timed phases: A-1 60 questions / 90 min; A-2 + B 35 questions / 120 min.
  // Answer keys and explanations are never rendered before final submission.
  function isFullMock(bank) {
    return !!bank && bank.questions.length === 95 &&
      questionsFor(bank, 'A1').length === 60 && questionsFor(bank, 'A2').length === 23 &&
      questionsFor(bank, 'B').length === 12;
  }
  const phaseLimit = phase => phase === 'A1' ? 90 * 60 : 120 * 60;
  const activeMock = () => Object.values(state.mockSessions || {}).find(m => m.phase !== 'done') || null;
  const mockForBank = version => state.mockSessions?.[version];
  const phaseQuestions = (bank, phase) => phase === 'A1' ? questionsFor(bank, 'A1') :
    [...questionsFor(bank, 'A2'), ...questionsFor(bank, 'B')];

    Math.floor((Date.now() - Date.parse(session.phaseStartedAt)) / 1000));
  const clockLabel = sec => `${String(Math.floor(sec / 3600)).padStart(2, '0')}:${String(Math.floor(sec / 60) % 60).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  function startMock(version) {
    const bank = state.banks[version];
    if (!isFullMock(bank)) return notify('本番模試はA-1:60問／A-2:23問／B:12問の問題集だけで利用できます', true);
    const running = activeMock();
    if (running && running.bank_version !== version) return notify('別の95問模試が進行中です。途中の結果を保護するため先に完了してください。', true);
    let session = mockForBank(version);
    if (!session || session.phase === 'done') {
      if (session?.phase === 'done') return showMockReview(version);
      session = {run_id: uniqueId(), bank_version:version, phase:'A1',
        startedAt:new Date().toISOString(), phaseStartedAt:new Date().toISOString(),
        answers:{},timestamps:{},phaseDurations:{},phaseCompleted:{}};
      state.mockSessions[version] = session;

    state.view = 'mock';

    render(); window.scrollTo(0,0);
  }
  function selectMockAnswer(id,value) {

    if (!phaseQuestions(bank,session.phase).some(q=>q.question_id===id)) return;
    session.answers[id]=value;session.timestamps[id]=new Date().toISOString();
    persist();

    const answered=phaseQuestions(bank,session.phase).filter(q=>session.answers[q.question_id]).length;
    const progress=$('mock-progress');if(progress) progress.textContent=`${answered}/${phaseQuestions(bank,session.phase).length}問回答済み`;
    const bar=$('mock-progress-bar');if(bar) bar.style.width=`${100*answered/phaseQuestions(bank,session.phase).length}%`;
  }
  function submitMockPhase() {
    const session=activeMock();
    if (!session||session.phase!=='A1') return;
    if (remainingSeconds(session)<=0) return closeMockPhase(true);
    const qs=phaseQuestions(state.banks[session.bank_version],'A1');
    const missing=qs.filter(q=>!session.answers[q.question_id]);
    ask(`A-1の60問を確定してA-2・Bへ進みます。未回答${missing.length}問は「わからない」として0点で記録されます。A-1には戻れません。`,()=>closeMockPhase(false));
  }
  function closeMockPhase(expired) {
    const session=activeMock();if(!session||session.phase!=='A1') return;
    const bank=state.banks[session.bank_version];
    for(const q of phaseQuestions(bank,'A1')) {
      if(!session.answers[q.question_id]) {session.answers[q.question_id]='?';session.timestamps[q.question_id]=new Date().toISOString();}
    }
    session.phaseDurations.A1=Math.min(phaseLimit('A1'),Math.max(0,Math.floor((Date.now()-Date.parse(session.phaseStartedAt))/1000)));
    session.phaseCompleted.A1=new Date().toISOString();

  }
  function submitMockFinal() {
    const session=activeMock();if(!session||session.phase!=='A2B') return;
    if(remainingSeconds(session)<=0) return closeMockFinal(true);

    const missing=qs.filter(q=>!session.answers[q.question_id]);
    ask(`本番模試95問を最終提出します。A-2・Bの未回答${missing.length}問は「わからない」として0点です。最終提出後に初めて正解・全選択肢の解説を表示します。`,()=>closeMockFinal(false));
  }
  function closeMockFinal(expired) {
    const session=activeMock();if(!session||session.phase!=='A2B') return;
    const bank=state.banks[session.bank_version];

      if(!session.answers[q.question_id]) {session.answers[q.question_id]='?';session.timestamps[q.question_id]=new Date().toISOString();}

    // One session is committed as 95 question records and three section attempts.
    const records=[],attempts=[];
    for(const part of PARTS) {
      const questions=questionsFor(bank,part),attempt_id=uniqueId();
      const subset=questions.map(q=>{
        const answer=session.answers[q.question_id],prior=state.records.some(r=>r.bank_version===bank.bank_version && r.question_id===q.question_id && r.question_version===q.question_version);
        return {record_id:uniqueId(),attempt_id,bank_version:bank.bank_version,

    }
    render();window.scrollTo(0,0);
    notify(`本番模試95問の採点完了。${expired?'残り時間が終了しました。':'最終提出が確定しました。'}成績を保存し同期します。`);

  function showMockReview(version) {

  function renderChoices(q, answer, done) {

  function legacyV2Backup(x) {
    const body = x?.state?.version === 'ipa-pds-95-revised-v2' ? x.state : x;
    if (body?.version !== 'ipa-pds-95-revised-v2' || !body.answers || !body.submitted)
      throw new Error('旧95問バックアップの形式に一致しません');
    const result = { records: [], attempts: [], schedule: {
      exam: body.exam || '', applicationFrom: body.applicationFrom || '', applicationTo: body.applicationTo || ''
    } };
    for (let i = 0; i < LEGACY.groups.length; i++) {
      const submitted = body.submitted[String(i)];
      if (!submitted) continue;
      const group = LEGACY.groups[i];
      const when = submitted.submittedAt || `${submitted.date}T12:00:00+09:00`;
      const day = submitted.date || localDate(new Date(when));
      const attempt_id = `legacy-v2-${i}-${day}`;
      let correct = 0, unknown = 0;
      for (const q of LEGACY.questions.slice(group.from, group.to)) {
        const answer = body.answers[q.id];
        if (!['A', 'B', 'C', 'D', '?'].includes(answer)) throw new Error(`旧問題 ${q.id} に採点済み回答がありません`);
        correct += Number(answer === q.answer);
        unknown += Number(answer === '?');
        result.records.push({
          record_id: `legacy-v2-${i}-${q.id}-${day}`, attempt_id,
          bank_version: 'ipa-pds-95-revised-v2', question_id: q.id, question_version: '2.0.0',
          section: q.section, major: q.major, minor: q.minor, difficulty: '未設定（旧版）',
          answer, correct: answer === q.answer, unknown: answer === '?', mode: 'learning',
          is_first_seen: true, answered_at: when, submitted_at: when, answer_date: day, elapsed_seconds: null
        });
      }
      result.attempts.push({ attempt_id, bank_version: 'ipa-pds-95-revised-v2', section: group.section,
        submitted_at: when, answer_date: day, total: group.to - group.from, correct, unknown, mode: 'learning' });
    }
    return result;
  }
  function validRecord(record) {
    if (!record || typeof record.record_id !== 'string' || !record.record_id ||
        typeof record.attempt_id !== 'string' || !record.attempt_id ||
        !record.bank_version || !record.question_id || !record.question_version ||
        !PARTS.includes(record.section) || !['A', 'B', 'C', 'D', '?'].includes(record.answer) ||
        typeof record.correct !== 'boolean' || typeof record.unknown !== 'boolean' ||
        !record.submitted_at || !isDate(record.answer_date) || !record.major || !record.minor)
      throw new Error('成績行の必須項目が不足しています');
    if (record.unknown !== (record.answer === '?') || (record.unknown && record.correct))
      throw new Error('成績行の「わからない」と正誤が矛盾しています');
  }
  function validAttempt(attempt) {
    if (!attempt || !attempt.attempt_id || !attempt.bank_version || !PARTS.includes(attempt.section) ||
        !Number.isInteger(attempt.total) || !Number.isInteger(attempt.correct) ||
        !Number.isInteger(attempt.unknown) || attempt.total < 1 || attempt.correct < 0 ||
        attempt.unknown < 0 || attempt.correct + attempt.unknown > attempt.total || !attempt.submitted_at)
      throw new Error('採点セットの形式に問題があります');
  }
  function stableRecord(r) {
    // UI-specific or legacy-specific optional fields may be absent; compare core immutable data.
    return ['record_id', 'attempt_id', 'bank_version', 'question_id', 'question_version',
      'section', 'major', 'minor', 'answer', 'correct', 'unknown', 'submitted_at', 'answer_date']
      .map(k => JSON.stringify(r[k])).join('|');
  }
  function mergeRecords(incoming) {
    if (!Array.isArray(incoming.records) || !Array.isArray(incoming.attempts))
      throw new Error('成績データにはrecordsとattemptsが必要です');
    const original = new Map(state.records.map(r => [r.record_id, r]));
    const seen = new Map();
    for (const record of incoming.records) {
      validRecord(record);
      const prev = seen.get(record.record_id) || original.get(record.record_id);
      if (prev && stableRecord(prev) !== stableRecord(record))
        throw new Error(`同じ記録IDに異なる成績が指定されています：${record.record_id}`);
      seen.set(record.record_id, record);
      const bank = state.banks[record.bank_version] || incoming.banks?.[record.bank_version];
      if (bank) {
        const q = bank.questions.find(z => z.question_id === record.question_id && z.question_version === record.question_version);
        if (!q) throw new Error(`記録に対応する問題版が存在しません：${record.question_id}`);
        if (record.correct !== (record.answer === q.answer))
          throw new Error(`正解と成績が一致しません：${record.question_id}`);
      }
    }
    const attemptsById = new Map(state.attempts.map(a => [a.attempt_id, a]));
    const importAttempts = new Map();
    for (const attempt of incoming.attempts) {
      validAttempt(attempt);
      const prior = attemptsById.get(attempt.attempt_id) || importAttempts.get(attempt.attempt_id);
      if (prior && (prior.total !== attempt.total || prior.correct !== attempt.correct || prior.unknown !== attempt.unknown || prior.bank_version !== attempt.bank_version))
        throw new Error(`同じ採点IDの件数が不一致です：${attempt.attempt_id}`);
      importAttempts.set(attempt.attempt_id, attempt);
    }
    const additions = [...seen.values()].filter(r => !original.has(r.record_id));
    const newAttempts = [...importAttempts.values()].filter(a => !attemptsById.has(a.attempt_id));
    state.records.push(...additions);
    state.attempts.push(...newAttempts);
    for (const key of ['exam', 'applicationFrom', 'applicationTo'])
      if (!state.schedule[key] && incoming.schedule?.[key]) state.schedule[key] = incoming.schedule[key];
    return { added: additions.length, attempts: newAttempts.length, duplicates: incoming.records.length - additions.length };
  }
  function parseRecordJSON(x) {
    if (x?.version === 'ipa-pds-95-revised-v2' || x?.state?.version === 'ipa-pds-95-revised-v2')
      return legacyV2Backup(x);
    if (!['ipa-study-records-1', SCHEMA].includes(x?.schema_version)) throw new Error('対応していない成績JSON形式です');
    if (!Array.isArray(x.records) || !Array.isArray(x.attempts)) throw new Error('成績のrecords/attemptsが不正です');
    return x;
  }
  async function importRecordFile(file) {
    if (!file) return;
    try {
      const parsed = parseRecordJSON(JSON.parse(await file.text()));
      const incomingBanks = parsed.banks ? Object.values(parsed.banks).map(normalizedBank) : [];
      // preflight on isolated copies to avoid partially modifying state.
      const before = state;
      const testState = JSON.parse(JSON.stringify(state));
      state = testState;
      let result;
      try {
        registerBanks(incomingBanks, '成績バックアップから復元');
        result = mergeRecords(parsed);
      } finally { state = before; }
      ask(`問題別記録${parsed.records.length}件から${result.added}件を追加し、問題集${incomingBanks.length}件を確認します。既存の履歴は保持します。続けますか？`, () => {
        registerBanks(incomingBanks, '成績バックアップから復元');
        const finalResult = mergeRecords(parsed);
        persist(); render(); notify(`成績を${finalResult.added}件追加、重複${finalResult.duplicates}件を除外しました`);
      });
    } catch (e) { reportError(e); }
    finally { $('record-file').value = ''; }
  }
  async function importBankFiles(files) {
    if (!files?.length) return;
    try {
      const input = [];
      for (const file of files) {
        const raw = JSON.parse(await file.text());
        input.push(...(Array.isArray(raw) ? raw : [raw]));
      }
      // Validate every file before inserting any new bank.
      const normalized = input.map(normalizedBank);
      for (const bank of normalized) if (state.banks[bank.bank_version] && !sameBank(state.banks[bank.bank_version], bank))
        throw new Error('既存bank_versionと設問内容が異なるため取込みできません');
      ask(`${normalized.length}問題集を登録します。形式を検査しましたが、問題内容の品質は別途監査が必要です。登録しますか？`, () => {
        const added = registerBanks(normalized, '手動JSON取込み');

  async function syncCatalog() {
    if (!['http:', 'https:'].includes(location.protocol)) {
      state.catalogStatus = 'ローカルHTMLでは公開カタログを自動読込できません。JSON追加を利用してください';
      persist(); render(); return;
    }
    state.catalogStatus = '公開カタログを確認中'; render();
    try {
      const response = await fetch('./catalog/manifest.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`manifest: HTTP ${response.status}`);
      const manifest = await response.json();
      if (manifest.schema_version !== 'ipa-study-catalog-manifest-v1' || !Array.isArray(manifest.banks))
        throw new Error('manifest.jsonの形式が不正です');
      const downloaded = [];
      for (const entry of manifest.banks) {
        if (typeof entry.file !== 'string' || !/^catalog\/[a-zA-Z0-9._\/-]+\.json$/.test(entry.file) || entry.file.includes('..'))
          throw new Error('不正な公開問題集パスが含まれています');
        const res = await fetch(`./${entry.file}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`${entry.file}: HTTP ${res.status}`);
        const bank = await res.json();
        if (entry.bank_version && entry.bank_version !== bank.bank_version)
          throw new Error(`${entry.file}: bank_versionがmanifestと一致しません`);
        if (entry.audit_status) bank.audit_status = entry.audit_status;
        downloaded.push(bank);
      }
      const count = registerBanks(downloaded, '公開カタログ');
      state.catalogStatus = `確認済み：${downloaded.length}問題集（今回追加${count}件）`;
      persist(); render();
      if (count) notify(`公開カタログから新しい問題集を${count}件追加しました`);
    } catch (e) {
      state.catalogStatus = `更新失敗：${e.message}（ローカル履歴・登録済問題は保持）`;
      render(); notify(state.catalogStatus, true);
    }
  }

    const remaining = remainingSeconds(session);
    const clock = $('mock-clock');
    if (clock) clock.textContent = clockLabel(remaining);
    if (remaining <= 0 && !confirmationBusy && $('modal').hidden) {
      try { closeMockPhase(true); } catch (e) { reportError(e); }
    }
  }, 1000);
  // Expose a limited read-only state summary for local automated diagnostics.
  Object.defineProperty(window, '__IPA_APP_STATUS__', {
    get: () => ({ banks: bankList().length, records: state.records.length,
      attempts: state.attempts.length, storageMessage, catalogStatus: state.catalogStatus })
  });
})();
</script></body></html>
