name: Validate and publish IPA learning app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ipa-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check quality audit records and catalog
        run: python tools/verify_catalog.py
      - name: Check that HTML can be rebuilt without changing catalog or HTML
        run: |
          python build_html.py
          git diff --exit-code -- index.html catalog/manifest.json
          python tools/verify_catalog.py
      - name: Install headless Chromium test environment
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run all 28 HTML regression tests (including dialog-disabled grading)
        run: python tests/test_common_app.py
      - name: Test 95-question learning batches (A1 10x6, A2 8+8+7, B 4x3)
        run: python tests/test_study_batches.py
      - name: Test timed 95-question mock mode with synthetic fixture (no exam bank release)
        run: python tests/test_full_mock.py
      - name: Test the audited 95-question bank through grading (93/95, one unknown)
        run: python tests/test_real95_release.py
      - name: Test private Google Sheets sync with mocked OAuth and API (no credentials)
        run: python tests/test_cloud_sync.py
      - name: Prepare public site (no study records)
        run: python tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
