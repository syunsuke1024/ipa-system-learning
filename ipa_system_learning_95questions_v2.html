 return `<section class="question" id="${esc(q.id)}"><div class="qtop"><span class="qno">問 ${n+1} ／ ${esc(q.id)}</span><span class="topic">${esc(q.major)} › ${esc(q.minor)}</span></div>${q.case?`<div class="scenario">${esc(q.case)}</div>`:''}<div class="stem">${esc(q.stem)}</div><div class="options">${options}</div>${ans}</section>`}
function gradeBlock(){
 const i=state.current;
 if(submitted(i))return;
 const block=bQuestions(i);
 if(!block.every(q=>state.answers[q.id])){
  showNotice('未解答の問題があります。「わからない」も選択できます。',true);return;
 }
 askConfirm(`${GROUPS[i].name}（${block.length}問）を採点します。\n採点後は解答を変更できません。`,()=>{
  state.submitted[String(i)]={date:state.date||localDate(),submittedAt:new Date().toISOString()};
  save();render();window.scrollTo(0,0);
 },{title:'採点の確認',approveText:'採点を確定する'});
}

function renderStudy(){const g=GROUPS[state.current];const done=submitted(state.current);const qs=bQuestions(state.current);const count=qs.filter(q=>state.answers[q.id]).length;const good=qs.filter(correctOf).length;const unknown=qs.filter(unknownOf).length;let sectionPosition=GROUPS.filter(x=>x.section===g.section).findIndex(x=>x===g)+1;let head=`<div class="intro"><strong>学習モードのルール（改訂版v2）</strong><p>このセットだけ解答 → まとめて採点 → 不正解・「わからない」の詳細解説を確認 → 次のセットへ進みます。採点済みのセットは戻って復習できます。</p><p>A-1は分野を混ぜて出題します。各選択肢は設問の条件と照らして評価してください。問題は全てオリジナルであり、IPA公開サンプルの転載ではありません。</p></div>`;
 let result=done?`<div class="card"><div class="ribbon"><h2 class="h2">採点結果：${esc(g.name)}</h2><span class="chip">${esc(state.submitted[String(state.current)].date)}に記録</span></div><div class="totals"><div class="metric"><b>${pct(good,qs.length)}</b><span>このセットの正答率</span></div><div class="metric"><b>${good}/${qs.length}</b><span>正解数</span></div><div class="metric"><b>${unknown}</b><span>「わからない」</span></div><div class="metric"><b>${qs.length-good-unknown}</b><span>通常の誤答</span></div></div><div class="panel-note">不正解・「わからない」は解説が開いた状態です。正解した問題も解説を展開できます。</div></div>`:'';
 let status=`<div class="ribbon"><h2 class="h2">${esc(TITLES[g.section])}</h2><span class="chip">${esc(g.name)} ／ 全${qs.length}問</span></div>${done?'':`<div class="card" style="padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><label for="answerDate" class="small">このセットの解答日</label><input class="filter" type="date" id="answerDate" value="${esc(state.date||localDate())}"/><span class="caption">採点結果にこの日付を記録します</span></div>`}`;
 let footer=done?`<div class="sticky-bottom"><span class="caption">採点済み ${qs.length}問 · 正答率 ${pct(good,qs.length)}</span><div class="controls"><button class="btn" data-export="json">進捗を保存</button>${state.current<GROUPS.length-1?`<button class="btn primary" data-next="1">次のセットへ →</button>`:`<button class="btn primary" data-view="dashboard">総合成績を見る →</button>`}</div></div>`:`<div class="sticky-bottom"><span class="caption">${count}/${qs.length}問 回答済み　（不明なら「わからない」）</span><button class="btn primary" id="grade-btn" data-grade="1" ${count!==qs.length?'disabled':''}>この${qs.length}問を採点する</button></div>`;
 return `${head}${status}${result}<div class="card"><div class="row"><div class="small">${done?'解答・解説':'問題一覧'}</div><div class="caption">${qs.length}問中 ${count}問 選択済み</div></div>${qs.map((q,i)=>questionHTML(q,g.from+i,done)).join('')}${footer}</div>`}
function chartSvg(data,domainName){const W=760,H=298,L=51,R=15,T=29,B=58,cW=W-L-R,cH=H-T-B;
 const parse=d=>new Date(`${d}T00:00:00`).getTime();const qdates=data.map(x=>parse(x.date)).filter(Number.isFinite);if(qdates.length===0)return '<div class="empty">採点結果を登録すると、この場所に日付別グラフが表示されます。</div>';
 let min=Math.min(...qdates);let max=Math.max(...qdates);let exam=state.exam?parse(state.exam):null; if(exam&&exam>min&&exam>max)max=exam;else max=Math.max(max,min+14*86400000);let denom=max-min;let x=t=>L+(t-min)/denom*cW,y=v=>T+(1-v/100)*cH;
 let byday={};data.forEach(a=>{if(!byday[a.date])byday[a.date]={c:0,n:0};byday[a.date].c+=a.c;byday[a.date].n+=a.n}); let days=Object.keys(byday).sort();let points=days.map(d=>({d,score:byday[d].c/byday[d].n*100}));let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(domainName)}の正答率の推移"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
 if(state.applicationFrom&&state.applicationTo){let s=parse(state.applicationFrom),e=parse(state.applicationTo);if(s<=e&&e>=min&&s<=max){let sx=Math.max(L,x(s)),ex=Math.min(W-R,x(e));g+=`<rect x="${sx}" y="${T}" width="${Math.max(0,ex-sx)}" height="${cH}" fill="#a3d9d6" fill-opacity=".38"/><text x="${Math.min(W-150,sx+4)}" y="${T+14}" font-size="11" fill="#2b7671">申込受付期間</text>`}}
 [0,25,50,75,100].forEach(p=>{g+=`<line x1="${L}" y1="${y(p)}" x2="${W-R}" y2="${y(p)}" stroke="#e3e9ed"/><text x="${L-11}" y="${y(p)+4}" text-anchor="end" font-size="11" fill="#5b6a77">${p}%</text>`});
 if(points.length>=2)g+=`<polyline points="${points.map(a=>`${x(parse(a.d))},${y(a.score)}`).join(' ')}" fill="none" stroke="#146c83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
 points.forEach(a=>{let xx=x(parse(a.d)),yy=y(a.score);g+=`<circle cx="${xx}" cy="${yy}" r="5" fill="#146c83" stroke="#fff" stroke-width="2"><title>${esc(a.d)}: ${Math.round(a.score)}%</title></circle>`});
 if(exam&&exam>=min&&exam<=max){let xx=x(exam);g+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${T+cH}" stroke="#c78127" stroke-width="2" stroke-dasharray="5 4"/><text x="${Math.min(xx-4,W-30)}" y="${T-10}" text-anchor="end" font-size="11" fill="#a86f23">試験日</text>`}
 let t=[min,min+(max-min)/2,max];t.forEach(d=>{let xx=x(d);g+=`<text x="${xx}" y="${H-25}" text-anchor="${d===min?'start':d===max?'end':'middle'}" font-size="11" fill="#526674">${new Date(d).toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'})}</text>`});g+=`<text x="${W/2}" y="${H-2}" font-size="11" text-anchor="middle" fill="#71818b">受験日</text></svg>`;return g}
function dashboard(){let qs=getGradedQs();let c=qs.filter(correctOf).length;let u=qs.filter(unknownOf).length;let total=qs.length;
 let dateRows=GROUPS.flatMap((g,i)=>{if(!submitted(i))return[];let arr=bQuestions(i);return[{date:state.submitted[String(i)].date,c:arr.filter(correctOf).length,n:arr.length,section:g.section,block:g.name}]});
 let sects=['A1','A2','B'].map(s=>{let arr=qs.filter(q=>q.section===s);return {name:TITLES[s],section:s,n:arr.length,c:arr.filter(correctOf).length,u:arr.filter(unknownOf).length}});
 let cats={};qs.forEach(q=>{let k=q.major;if(!cats[k])cats[k]={name:k,n:0,c:0,u:0,sub:{}};let a=cats[k];a.n++;if(correctOf(q))a.c++;if(unknownOf(q))a.u++;if(!a.sub[q.minor])a.sub[q.minor]={name:q.minor,n:0,c:0,u:0};a.sub[q.minor].n++;if(correctOf(q))a.sub[q.minor].c++;if(unknownOf(q))a.sub[q.minor].u++});
 let namesMajor=Object.keys(cats).sort();let filter=state.topicFilter||'all';let graphQs=filter==='all'?qs:qs.filter(q=>q.major===filter);let filteredRows=GROUPS.flatMap((g,i)=>{if(!submitted(i))return[];let arr=bQuestions(i).filter(q=>filter==='all'||q.major===filter);return arr.length?[{date:state.submitted[String(i)].date,c:arr.filter(correctOf).length,n:arr.length}]:[]});
 let sectionTable=`<table><thead><tr><th>科目</th><th class="num">解答数</th><th class="num">正解</th><th class="num">わからない</th><th class="num">正答率</th></tr></thead><tbody>${sects.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${x.n}</td><td class="num">${x.c}</td><td class="num">${x.u}</td><td class="num"><strong>${pct(x.c,x.n)}</strong></td></tr>`).join('')}</tbody></table>`;
 let majorRows=namesMajor.length?`<table><thead><tr><th>大分類</th><th class="num">問題数</th><th class="num">正答率</th><th class="num">不明率</th></tr></thead><tbody>${namesMajor.map(k=>{let x=cats[k];return`<tr><td><strong>${esc(k)}</strong><div class="bar"><i style="width:${x.c/x.n*100}%"></i></div></td><td class="num">${x.n}</td><td class="num">${pct(x.c,x.n)}</td><td class="num">${pct(x.u,x.n)}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">採点が終わると分野別成績を表示します。</div>';
 let subRows=namesMajor.length?`<table><thead><tr><th>大分類 / 小分類</th><th class="num">解答</th><th class="num">正答</th><th class="num">不明</th></tr></thead><tbody>${namesMajor.flatMap(k=>Object.values(cats[k].sub).map(x=>`<tr><td><span class="tiny">${esc(k)}</span><br>${esc(x.name)}</td><td class="num">${x.n}</td><td class="num">${pct(x.c,x.n)}</td><td class="num">${x.u}</td></tr>`)).join('')}</tbody></table>`:'';
 return `<div class="ribbon"><h2 class="h2">成績ダッシュボード</h2><span class="chip">実際に採点した結果のみ</span></div>
 <div class="card"><div class="totals"><div class="metric"><b>${pct(c,total)}</b><span>採点済み全体の正答率</span></div><div class="metric"><b>${c}/${total}</b><span>正解 / 採点済み</span></div><div class="metric"><b>${u}</b><span>「わからない」</span></div><div class="metric"><b>${passedCount()}/12</b><span>完了セット数</span></div></div><div class="panel-note">この得点は学習用の独自集計であり、本試験の公式スコアや合格基準を示すものではありません。</div></div>
 <div class="card"><h3>科目別の正答率</h3>${sectionTable}</div>
 <div class="card"><div class="row"><h3 style="margin:0">日付別 正答率推移</h3><label class="small">表示分野 <select class="filter" id="topic-filter"><option value="all">全分野</option>${namesMajor.map(x=>`<option value="${esc(x)}" ${filter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div><p class="caption">同じ日に解答したセットは問題数で加重して集計。分野の問題数が少ないと正答率の変動が大きくなる点に注意してください。</p><div class="chart-box">${chartSvg(filteredRows,filter==='all'?'全分野':filter)}</div><div class="setting"><div><label for="exam">本試験日（公表後に設定）</label><input type="date" id="exam" value="${esc(state.exam)}"></div><div><label for="applicationFrom">申込開始日</label><input type="date" id="applicationFrom" value="${esc(state.applicationFrom)}"></div><div><label for="applicationTo">申込終了日</label><input type="date" id="applicationTo" value="${esc(state.applicationTo)}"></div></div><div class="caption">現時点で未公表の日程を入力する場合は表示確認用です。試験日が得点記録日より後の場合、グラフの右端が試験日になります。</div></div>
 <div class="card"><h3>大分類別成績</h3>${majorRows}<p class="caption">問題数が10問未満の分野は、傾向を判断するにはまだデータが少ない参考値です。</p></div>
 <div class="card"><details><summary>小分類別の詳細を表示する</summary><div style="margin-top:14px">${subRows||'まだデータがありません。'}</div></details></div>
 <div class="card"><h3>採点済みセットの記録</h3>${dateRows.length?`<table><thead><tr><th>解答日</th><th>セット</th><th class="num">正答率</th></tr></thead><tbody>${dateRows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.block)}</td><td class="num">${pct(x.c,x.n)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">まだ記録がありません。</div>'}</div>
 <div class="card"><h3>データの保存・移行</h3><p class="small">JSONは解答途中を含む進捗の再開用、CSVは問題単位の成績分析用です。長期学習では必ずバックアップを残してください。</p><div class="controls"><button class="btn primary" data-export="json">JSONバックアップを保存</button><button class="btn" data-export="csv">解答履歴CSVを保存</button><button class="btn" data-import="1">JSONから復元</button><button class="btn danger" data-reset="1">進捗を初期化</button></div></div>`}
function review(){const all=getGradedQs().filter(q=>!correctOf(q));const filter=state.questionFilter||'all';const filtered=filter==='all'?all:filter==='unknown'?all.filter(unknownOf):all.filter(q=>!unknownOf(q));return `<div class="ribbon"><h2 class="h2">復習ノート</h2><span class="chip">不正解・わからない ${all.length}問</span></div><div class="card"><div class="row"><p class="small">不明だった問題と間違えた問題をまとめて復習できます。正解していても根拠を説明できない場合は、学習画面から解説を再確認してください。</p><select class="filter" id="question-filter"><option value="all" ${filter==='all'?'selected':''}>すべて</option><option value="unknown" ${filter==='unknown'?'selected':''}>わからないだけ</option><option value="wrong" ${filter==='wrong'?'selected':''}>選択して誤答</option></select></div>${filtered.length?`<div class="question-list">${filtered.map(q=>`<div class="review-item"><div class="row"><b>${esc(q.id)}　${esc(q.major)} / ${esc(q.minor)}</b><span class="status ${unknownOf(q)?'warn':'bad'}">${unknownOf(q)?'わからない':'不正解'}</span></div><div class="small" style="margin-top:6px">${esc(q.stem)}</div><details><summary>正解・詳しい解説を表示</summary><p><b>正解：${esc(q.answer)} ${esc(q.options[names.indexOf(q.answer)])}</b></p><p><b>正解の根拠：</b>${esc(q.why)}</p><ol class="option-review">${q.options.map((o,i)=>`<li><b>${names[i]}.</b> ${esc(q.optionNotes[i])}</li>`).join('')}</ol><p><b>補足：</b>${esc(q.insight)}</p></details></div>`).join('')}</div>`:'<div class="empty">条件に合う復習問題はありません。</div>'}</div>`}
function render(){renderSide();document.getElementById('main').innerHTML=state.view==='dashboard'?dashboard():state.view==='review'?review():renderStudy()}
function setAnswer(id,v){let cur=state.current;if(submitted(cur)||!bQuestions(cur).some(q=>q.id===id))return;state.answers[id]=v;save();let qs=bQuestions(cur),count=qs.filter(q=>state.answers[q.id]).length;const cap=document.querySelector('.sticky-bottom .caption');if(cap)cap.textContent=`${count}/${qs.length}問 回答済み （不明なら「わからない」）`;const btn=document.getElementById('grade-btn');if(btn)btn.disabled=count!==qs.length;const item=document.querySelector(`input[data-qid="${id}"][value="${v}"]`);if(item){document.querySelectorAll(`input[data-qid="${id}"]`).forEach(x=>{if(x.closest('label'))x.closest('label').style.background=x.checked?'#edf7f8':''})}renderSide()}
function exportData(type){if(type==='json'){download(`ipa_system_learning_v2_${localDate()}_backup.json`,JSON.stringify({app:'IPAシステム領域・学習モード',exportedAt:new Date().toISOString(),state},null,2),'application/json;charset=utf-8');return;}
 let headers=['bank_version','problem_id','subject','major','minor','answered_at','block','selected','correct_answer','outcome','points'];let lines=[headers.map(escapeCSV).join(',')];GROUPS.forEach((g,i)=>{let m=state.submitted[String(i)];bQuestions(i).forEach(q=>{if(!state.answers[q.id])return;let a=state.answers[q.id];let result=m?(a===q.answer?'correct':a==='?'?'unknown':'wrong'):'not_submitted';let row=[VERSION,q.id,q.section,q.major,q.minor,m?.date||'',g.name,a,q.answer,result,m?(a===q.answer?1:0):''];lines.push(row.map(escapeCSV).join(','))})});download(`ipa_system_learning_v2_${localDate()}_results.csv`,'\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8')}
function download(filename,content,mime){let blob=new Blob([content],{type:mime});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500)}
async function importData(file){
 if(!file)return;
 try{
  const payload=JSON.parse(await file.text());const obj=payload.state||payload;
  if(obj.version!==VERSION||typeof obj.answers!=='object'||typeof obj.submitted!=='object'){
   showNotice('このバージョンの進捗データではありません。',true);return;
  }
  askConfirm('現在の進捗をJSONファイルの内容で上書きします。よろしいですか？',()=>{
   const valid=new Set(QUESTIONS.map(q=>q.id));const a={};
   for(const [k,v] of Object.entries(obj.answers))if(valid.has(k)&&[...names,'?'].includes(v))a[k]=v;
   const sub={};
   for(const [k,v] of Object.entries(obj.submitted))if(/^\d+$/.test(k)&&+k>=0&&+k<GROUPS.length&&v&&typeof v.date==='string')sub[k]=v;
   state={...fresh(),...obj,answers:a,submitted:sub};
   state.current=Math.min(Math.max(+state.current||0,0),GROUPS.length-1,unlocked());
   save();render();window.scrollTo(0,0);showNotice('進捗を復元しました。');
  },{title:'バックアップから復元',approveText:'復元する'});
 }catch(e){showNotice('JSONを読み取れませんでした：'+e.message,true)}
}

function reset(){
 askConfirm('全解答・採点記録・試験日設定を初期化します。\n事前にJSONバックアップを保存しましたか？\nこの操作は元に戻せません。',()=>{
  state=fresh();save();render();window.scrollTo(0,0);showNotice('進捗を初期化しました。');
 },{title:'進捗の初期化',danger:true,approveText:'すべて初期化する'});
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-confirm-answer],[data-view],[data-jump],[data-grade],[data-next],[data-export],[data-import],[data-reset]');if(!el||el.disabled)return;if(el.dataset.confirmAnswer){resolveConfirm(el.dataset.confirmAnswer==='yes');return}if(el.dataset.view){setView(el.dataset.view);return}if(el.dataset.jump!==undefined){jump(+el.dataset.jump);return}if(el.dataset.grade){gradeBlock();return}if(el.dataset.next){jump(state.current+1);return}if(el.dataset.export){exportData(el.dataset.export);return}if(el.dataset.import){document.getElementById('restore').click();return}if(el.dataset.reset){reset();return}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('input[data-qid]')){setAnswer(t.dataset.qid,t.value);return}if(t.id==='topic-filter'){state.topicFilter=t.value;save();render();return}if(t.id==='question-filter'){state.questionFilter=t.value;save();render();return}if(t.id==='answerDate'){state.date=t.value||localDate();save();return}if(['exam','applicationFrom','applicationTo'].includes(t.id)){const k={exam:'exam',applicationFrom:'applicationFrom',applicationTo:'applicationTo'}[t.id];state[k]=t.value;save();render();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pendingConfirm){resolveConfirm(false);}});
document.getElementById('restore').addEventListener('change',e=>{importData(e.target.files?.[0]);e.target.value='' });
function checkBank(){const n={A1:0,A2:0,B:0};QUESTIONS.forEach(q=>{if(!Array.isArray(q.optionNotes)||q.optionNotes.length!==q.options.length||!q.insight)throw new Error('解説の不足: '+q.id);n[q.section]++;if(![4,6,8,10].includes(q.options.length)||!names.slice(0,q.options.length).includes(q.answer)||!q.major||!q.minor)throw new Error('問題データが不正: '+q.id)});if(n.A1!==60||n.A2!==23||n.B!==12)throw new Error('問題数の不一致');}
checkBank();load();if(!submitted(state.current))state.date=localDate();save();render();
</script>
</body>
